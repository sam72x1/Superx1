# Render Background Worker واحد + قرص دائم (القرار 5).
# يحتفظ باسم الخدمة والقرص الحاليين، ويشغّل الماسح وKronos محليًا داخل نفس
# Standard instance حتى لا تُحاسب خدمة استدلال ثانية.
services:
  - type: worker
    name: runner-scanner
    runtime: python
    branch: main                         # النشر من الفرع المستقر (main)
    # Kronos وحده بلغ 445.81MiB RSS فعليًا؛ نجمعه مع الماسح على Standard (2GB)
    # بدل Starter + خدمة Standard منفصلة.
    plan: standard
    # يُخبز checkout والأوزان ذات المراجعات المثبتة داخل build artifact. runtime
    # يعمل offline ولا يكتب النموذج على قرص SQLite الدائم.
    buildCommand: python -m pip install -r requirements.txt -r services/kronos_inference/requirements.txt && python -m services.kronos_inference.build_runtime && python -c "import runner_scanner.main"
    # supervisor هو PID الرئيسي: يبقي عطل Shadow معزولًا، ويمرر SIGTERM للماسح
    # أولًا لتفريغ طابوره ثم يوقف خدمة loopback.
    startCommand: python -m runner_scanner.render_supervisor
    # الخدمات ذات القرص لا تقبل maxShutdownDelaySeconds في Blueprint؛ Render
    # يمنحها نافذة الإيقاف الافتراضية (30ث)، والمشرف يلتزم بها أدناه.
    autoDeployTrigger: off
    disk:
      name: runner-data
      mountPath: /var/data   # لازم يطابق DB_PATH
      sizeGB: 1
    envVars:
      - key: MASSIVE_API_KEY
        sync: false          # أدخله في لوحة Render (سرّي)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DB_PATH
        value: /var/data/runner_scanner.sqlite3
      - key: POLL_INTERVAL_SEC
        value: "45"
      - key: KEEPALIVE_PORT
        value: "10000"
      - key: TECH_READINESS_MIN
        value: "65"          # قرار المستخدم بالبيانات (كان 70 انجرافًا)
      - key: HALTS_ENABLED
        value: "true"
      # ثبّت نسخة بايثون: يوم ترفع Render افتراضيها قد لا يوجد wheel لـ
      # pandas/numpy (تبعية yfinance) فيفشل البناء من المصدر (تأمين رخيص).
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Kronos يعمل كـShadow فقط: لا يدخل في البوابات أو الدرجات أو التنبيه.
      # HTTP محلي داخل نفس instance؛ لا عنوان عام ولا خدمة Render ثانية.
      - key: KRONOS_SHADOW_ENABLED
        value: "true"
      - key: KRONOS_SERVICE_URL
        value: http://127.0.0.1:18080
      # يستبدل أي fromService قديم تحتفظ به مزامنة Blueprint. الـsupervisor
      # يحذفه من بيئة الطفل لأن loopback لا يحتاج Bearer.
      - key: KRONOS_SERVICE_TOKEN
        value: loopback-only
      - key: KRONOS_LOCAL_PORT
        value: "18080"
      - key: KRONOS_STARTUP_TIMEOUT_SEC
        value: "60"
      - key: KRONOS_RESTART_DELAY_SEC
        value: "5"
      - key: KRONOS_HEALTH_INTERVAL_SEC
        value: "10"
      - key: KRONOS_HEALTH_FAILURE_LIMIT
        value: "3"
      # مهلة العميل 120ث؛ بعد 150ث يعدّ المشرف الاستدلال عالقًا ويعيد العملية.
      - key: KRONOS_HANG_TIMEOUT_SEC
        value: "150"
      - key: KRONOS_SCANNER_SHUTDOWN_TIMEOUT_SEC
        value: "15"
      - key: KRONOS_DEVICE
        value: cpu
      - key: KRONOS_SOURCE_REVISION
        value: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - key: KRONOS_MODEL_REVISION
        value: 901c26c1332695a2a8f243eb2f37243a37bea320
      - key: KRONOS_TOKENIZER_REVISION
        value: 0e0117387f39004a9016484a186a908917e22426
      # لا يستهلك الاستدلال كل CPU العامل على حساب دورة الماسح.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: KRONOS_TIMEOUT_SEC
        value: "120"
      - key: KRONOS_CONTEXT_DAYS
        value: "14"
      - key: KRONOS_LOOKBACK
        value: "512"
      - key: KRONOS_PRED_LEN
        value: "18"
      - key: KRONOS_HORIZONS
        value: "6,12,18"
      - key: KRONOS_QUEUE_SIZE
        value: "32"
      - key: KRONOS_OBSERVATION_GRACE_MIN
        value: "3"
      - key: KRONOS_MAX_CONTEXT_LAG_SEC
        value: "360"
